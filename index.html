<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Architect's Lament</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/twist.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Raleway:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div id="game-container">

        <div id="title-screen" class="screen active">
            <h1>THE ARCHITECT'S LAMENT</h1>
            <p>A journey through simulated realities</p>
            <button id="start-btn">BEGIN EXPERIMENT</button>
        </div>

        <div id="game-screen" class="screen">
            <div id="dialogue-box">
                <div id="speaker"></div>
                <div id="text"></div>
                <div id="choices"></div>
            </div>
        </div>

        <!-- ✅ NEW STATS SCREEN -->
        <div id="stats-screen" class="screen">
            <div class="stats-container">
                <h2>EXPERIMENT STATISTICS</h2>
                <div id="stats-content"></div>
                <div class="stats-buttons">
                    <button id="close-stats-btn" class="btn-primary">RETURN</button>
                    <button id="export-stats-btn" class="btn-secondary">EXPORT DATA</button>
                    <button id="reset-stats-btn" class="btn-danger">RESET STATS</button>
                </div>
            </div>
        </div>

    </div>

    <style>
    #twist-ending-screen {
        font-family: 'Courier New', monospace;
        text-rendering: geometricPrecision;
    }
    
    #twist-ending-screen h1 {
        font-size: 3rem;
        margin-bottom: 30px;
        animation: endingGlow 2s infinite alternate;
    }
    
    @keyframes endingGlow {
        from { text-shadow: 0 0 10px currentColor; }
        to { text-shadow: 0 0 30px currentColor; }
    }
    
    .ending-stats {
        background: rgba(0, 0, 0, 0.7);
        border: 1px solid #333;
        border-radius: 5px;
        padding: 20px;
        margin: 20px 0;
        color: #888;
    }
</style>

    <script src="js/main.js"></script>
</body>
</html>
